name: SDK E2E Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOCOVERDIR: "coverage"

jobs:
  ts:
    name: TS SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ./go.mod

      # pnpm must be set up before setup-node so the "pnpm" cache can resolve
      # the pnpm store path.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          # Key on both lockfiles this job installs: the UI build (the largest
          # install, via make build-ui) and the tests/js E2E deps.
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            tests/js/pnpm-lock.yaml

      - name: Build UI
        run: make build-ui

      - name: Build dev serve
        run: |
          go build -cover -o ./inngest-bin ./cmd

      - name: Run E2E tests
        run: |
          cd ./tests/js
          pnpm install --frozen-lockfile
          pnpm dev &
          "$GITHUB_WORKSPACE/scripts/wait-for-healthy.sh" "SDK app" "$SDK_URL"
          cd ../../
          # The connect gRPC ports (50052/50053) sit inside the kernel's
          # ephemeral port range; reserve them so outbound connections cannot
          # claim them before the dev server binds its listeners.
          sudo sysctl -wq net.ipv4.ip_local_reserved_ports=50052-50053
          echo "Running dev server"
          mkdir $GOCOVERDIR
          nohup ./inngest-bin dev --no-discovery --no-poll 2> /tmp/devserver-logs-ts.txt &
          echo "Ran dev server"
          ./scripts/wait-for-healthy.sh "dev server" http://127.0.0.1:8288/health
          gotestsum --junitfile=junit.xml --format=standard-verbose -- ./tests
        env:
          INNGEST_SIGNING_KEY: test
          API_URL: http://127.0.0.1:8288
          SDK_URL: http://127.0.0.1:3000/api/inngest
          TEST_MODE: true
          EXPERIMENTAL_KEY_QUEUES_ENABLE: "true"
          LOG_LEVEL: trace

      - name: Convert coverage for tooling
        run: |
          ls -la $GOCOVERDIR
          # pass in all the directories in coverage to be merged
          go tool covdata percent -i=$GOCOVERDIR | tee coverage.txt

      - name: Upload devserver logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devserver-logs-ts
          path: /tmp/devserver-logs-ts.txt
          retention-days: 7

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ts-e2e

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          flags: ts-e2e
          report_type: test_results

  # refs:
  #  - https://go.dev/doc/build-cover
  golang:
    name: "Go SDK / split: ${{ matrix.index }}"
    strategy:
      fail-fast: false
      matrix:
        parallelism: [3]
        index: [0, 1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ./go.mod

      - name: Start postgres container
        run: |
          # Docker Hub pulls intermittently time out on hosted runners; retry
          # the pull instead of letting a single timeout fail the job.
          for i in $(seq 1 5); do
            if docker pull postgres:17; then
              break
            fi
            if [ "$i" = "5" ]; then
              echo "ERROR: failed to pull postgres:17"
              exit 1
            fi
            echo "docker pull failed, retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          docker run -d --name inngest-test-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=inngest_test \
            -p 5432:5432 \
            postgres:17
          # Wait for postgres to be ready
          for i in $(seq 1 30); do
            if docker exec inngest-test-postgres pg_isready -U postgres > /dev/null 2>&1; then
              echo "Postgres is ready"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "ERROR: Postgres failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: Build dev server
        run: go build -cover -o ./inngest-bin ./cmd

      - name: Install tools
        run: go install tool

      - name: Run E2E tests
        run: |
          # The connect gRPC ports (50052/50053) sit inside the kernel's
          # ephemeral port range; reserve them so outbound connections cannot
          # claim them before the dev server binds its listeners.
          sudo sysctl -wq net.ipv4.ip_local_reserved_ports=50052-50053
          echo "Running dev server"
          mkdir $GOCOVERDIR
          nohup ./inngest-bin dev --no-discovery --no-poll --postgres-uri "postgres://postgres:postgres@localhost:5432/inngest_test?sslmode=disable" 2> /tmp/dev-output.txt &
          echo "Ran dev server"
          ./scripts/wait-for-healthy.sh "dev server" http://127.0.0.1:8288/health

          gotesplit -total ${{ matrix.parallelism }} -index ${{ matrix.index }} -junit-dir test-results ./tests/golang -- -v -count=1
        env:
          API_URL: http://127.0.0.1:8288
          INNGEST_EVENT_KEY: test
          INNGEST_SIGNING_KEY: 7468697320697320612074657374206b6579
          INNGEST_DEV: http://127.0.0.1:8288
          TEST_MODE: true
          TEST_DATABASE: postgres
          EXPERIMENTAL_KEY_QUEUES_ENABLE: "true"

      - name: Convert coverage for tooling
        run: |
          ls -la $GOCOVERDIR
          # pass in all the directories in coverage to be merged
          go tool covdata percent -i=$GOCOVERDIR | tee coverage.txt

      - name: Upload devserver logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devserver-logs-golang-split-${{ matrix.index }}
          path: /tmp/dev-output.txt
          retention-days: 7

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: go-e2e,split-${{ matrix.index }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-results/junit-${{ matrix.index }}-0.xml
          flags: go-e2e,split-${{ matrix.index }}
          report_type: test_results

  batch:
    name: Batch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ./go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Start postgres container
        run: |
          # Docker Hub pulls intermittently time out on hosted runners; retry
          # the pull instead of letting a single timeout fail the job.
          for i in $(seq 1 5); do
            if docker pull postgres:17; then
              break
            fi
            if [ "$i" = "5" ]; then
              echo "ERROR: failed to pull postgres:17"
              exit 1
            fi
            echo "docker pull failed, retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          docker run -d --name inngest-test-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=inngest_test \
            -p 5432:5432 \
            postgres:17
          # Wait for postgres to be ready
          for i in $(seq 1 30); do
            if docker exec inngest-test-postgres pg_isready -U postgres > /dev/null 2>&1; then
              echo "Postgres is ready"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "ERROR: Postgres failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: Build dev server
        run: go build -cover -o ./inngest-bin ./cmd

      - name: Run batch E2E tests
        run: |
          # The connect gRPC ports (50052/50053) sit inside the kernel's
          # ephemeral port range; reserve them so outbound connections cannot
          # claim them before the dev server binds its listeners.
          sudo sysctl -wq net.ipv4.ip_local_reserved_ports=50052-50053
          echo "Running dev server"
          mkdir $GOCOVERDIR
          nohup ./inngest-bin dev --no-discovery --no-poll --postgres-uri "postgres://postgres:postgres@localhost:5432/inngest_test?sslmode=disable" 2> /tmp/dev-output.txt &
          echo "Ran dev server"
          ./scripts/wait-for-healthy.sh "dev server" http://127.0.0.1:8288/health

          gotestsum --junitfile=junit.xml --format=standard-verbose -- ./tests/batch/... -count=1
        env:
          API_URL: http://127.0.0.1:8288
          INNGEST_EVENT_KEY: test
          INNGEST_SIGNING_KEY: 7468697320697320612074657374206b6579
          INNGEST_DEV: http://127.0.0.1:8288
          TEST_MODE: true
          TEST_DATABASE: postgres
          EXPERIMENTAL_KEY_QUEUES_ENABLE: "true"
          EXPERIMENTAL_SPLIT_BATCH_PARTITION_BY_FUNCTION: "true"

      - name: Convert coverage for tooling
        run: |
          ls -la $GOCOVERDIR
          go tool covdata percent -i=$GOCOVERDIR | tee coverage.txt

      - name: Upload devserver logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devserver-logs-batch
          path: /tmp/dev-output.txt
          retention-days: 7

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: batch-e2e

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          flags: batch-e2e
          report_type: test_results

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ./go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Start postgres container
        run: |
          # Docker Hub pulls intermittently time out on hosted runners; retry
          # the pull instead of letting a single timeout fail the job.
          for i in $(seq 1 5); do
            if docker pull postgres:17; then
              break
            fi
            if [ "$i" = "5" ]; then
              echo "ERROR: failed to pull postgres:17"
              exit 1
            fi
            echo "docker pull failed, retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          docker run -d --name inngest-test-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=inngest_test \
            -p 5432:5432 \
            postgres:17
          # Wait for postgres to be ready
          for i in $(seq 1 30); do
            if docker exec inngest-test-postgres pg_isready -U postgres > /dev/null 2>&1; then
              echo "Postgres is ready"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "ERROR: Postgres failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: Build dev server
        run: go build -cover -o ./inngest-bin ./cmd

      - name: Run API tests
        run: |
          # The connect gRPC ports (50052/50053) sit inside the kernel's
          # ephemeral port range; reserve them so outbound connections cannot
          # claim them before the dev server binds its listeners.
          sudo sysctl -wq net.ipv4.ip_local_reserved_ports=50052-50053
          echo "Running dev server"
          mkdir $GOCOVERDIR
          nohup ./inngest-bin dev --no-discovery --no-poll --postgres-uri "postgres://postgres:postgres@localhost:5432/inngest_test?sslmode=disable" 2> /tmp/dev-output.txt &
          echo "Ran dev server"
          ./scripts/wait-for-healthy.sh "dev server" http://127.0.0.1:8288/health

          gotestsum --junitfile=junit.xml --format=standard-verbose -- ./tests/api/... -count=1
        env:
          API_URL: http://127.0.0.1:8288
          INNGEST_EVENT_KEY: test
          INNGEST_SIGNING_KEY: 7468697320697320612074657374206b6579
          INNGEST_DEV: http://127.0.0.1:8288
          TEST_MODE: true
          TEST_DATABASE: postgres
          EXPERIMENTAL_KEY_QUEUES_ENABLE: "true"

      - name: Convert coverage for tooling
        run: |
          ls -la $GOCOVERDIR
          go tool covdata percent -i=$GOCOVERDIR | tee coverage.txt

      - name: Upload devserver logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devserver-logs-api
          path: /tmp/dev-output.txt
          retention-days: 7

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: api-e2e

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          flags: api-e2e
          report_type: test_results

  execution:
    name: Execution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ./go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run execution tests
        run: gotestsum --junitfile=junit.xml --format=standard-verbose -- ./tests/execution/... -count=1 -coverprofile=coverage.txt
        env:
          EXPERIMENTAL_KEY_QUEUES_ENABLE: "true"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: exec

  e2e-ci:
    name: E2E CI
    if: always()
    needs: [ts, golang, batch, api, execution]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more E2E jobs failed or were cancelled"
            exit 1
          fi
