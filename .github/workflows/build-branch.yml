name: Build Branch Image

on:
  workflow_dispatch:
  push:
    branches:
      - "devin/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ./go.mod

      - name: Create placeholder files for embeds
        run: |
          # Website submodule (internal/embeddocs) - not checked out in CI
          mkdir -p internal/embeddocs/website/pages/docs
          echo "placeholder" > internal/embeddocs/website/pages/docs/placeholder.md
          # Dev server UI static assets - not built in CI
          echo "placeholder" > pkg/devserver/static/placeholder.txt

      - name: Generate code
        run: go generate ./...

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o inngest ./cmd/

      - name: Extract branch tag
        id: tag
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          TAG="${BRANCH//\//-}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.goreleaser
          push: true
          tags: |
            ghcr.io/avido-ai/inngest:${{ steps.tag.outputs.tag }}
          platforms: linux/amd64
